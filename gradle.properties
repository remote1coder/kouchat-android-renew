# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# Note: this configuration will need to be updated to build a release apk. See INSTALL
RELEASE_STORE_FILE=mock.keystore
RELEASE_STORE_PASSWORD=replace-me
RELEASE_KEY_ALIAS=replace-me
RELEASE_KEY_PASSWORD=replace-me

# AndroidX (modernization)
android.useAndroidX=true
# Jetifier is disabled: it fails on Mockito 5's byte-buddy jars (class file major version 68+),
# and all dependencies are already AndroidX or plain libraries that don't need rewriting.
android.enableJetifier=false
org.gradle.jvmargs=-Xmx2048m

# Gradle runs on the JDK selected by JAVA_HOME (or the java on PATH).
# Android Gradle Plugin 8.5 requires JDK 17, so do not hardcode a
# machine-specific JDK path here. To override it per machine without
# touching this file, set JAVA_HOME or add this to
# ~/.gradle/gradle.properties (the user-level file):
#   org.gradle.java.home=/path/to/jdk-17

# Run the Kotlin compiler in the Gradle daemon process (instead of a separate Kotlin daemon).
# This avoids reusing a stale Kotlin daemon that may have been started on an incompatible JDK.
kotlin.compiler.execution.strategy=in-process
